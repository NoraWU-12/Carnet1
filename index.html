<title>Carnet · 法语生词本</title>
<style>
  :root{
    --bg:#f7f5fc; --card:#ffffff; --ink:#2b2540; --muted:#8b85a3;
    --line:#ebe6f5; --brand:#8257c9; --brand-2:#a478e0; --brand-soft:#f0e9fb;
    --shadow:0 1px 2px rgba(76,50,120,.04),0 8px 24px rgba(76,50,120,.08);
    --radius:14px;
    --hl:#fff2b2; --hl-line:#f4d84a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1020px;margin:0 auto;padding:0 20px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .btn{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:9px;
    font-size:14px;font-weight:500;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--brand-2)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{background:#6f45b8;border-color:#6f45b8}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
  .savedot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-right:2px}
  .savedot i{width:6px;height:6px;border-radius:50%;background:#4caf7d;display:block}

  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .hd{display:flex;align-items:center;gap:12px;height:62px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px}
  .logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8257c9,#b48ae8);
    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
  .logo small{font-weight:400;color:var(--muted);font-size:13px;margin-left:2px}
  .hd-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

  .hero{padding:24px 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .hero h1{font-size:22px;letter-spacing:-.3px}
  .hero span{color:var(--muted);font-size:14px}

  /* 添加区 */
  .adder{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin:14px 0 22px;box-shadow:var(--shadow)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .adder input[type=text],.adder textarea,select{
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;
    font-family:inherit;outline:none;background:var(--card);color:var(--ink)}
  @media(min-width:561px){.adder input[type=text],.adder textarea,select{font-size:14px}}
  .adder input[type=text]:focus,.adder textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  textarea{resize:vertical;min-height:38px;line-height:1.5}
  .fld{flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;color:var(--muted);font-weight:500}
  select{min-width:135px}
  .full input,.full textarea{width:100%}
  .section-title{font-size:12px;color:var(--muted);font-weight:600;margin:6px 0 8px;letter-spacing:.3px}

  .pair{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fcfbff}
  .pair .prow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .pair .prow input[type=text]{flex:1;min-width:0}
  .fbtns{display:flex;gap:4px}
  .fbtn{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;font-size:12px;font-weight:700;
    display:grid;place-items:center;background:var(--card);color:var(--muted)}
  .fbtn:hover{border-color:var(--brand-2)}
  .fbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .fbtn.b.on{background:#2b2540;border-color:#2b2540}
  .fbtn.h.on{background:var(--hl-line);color:#4a3c00;border-color:var(--hl-line)}
  .fbtn.c.on{background:#d946ef;color:#fff;border-color:#d946ef}

  .recos{display:flex;gap:8px;flex-wrap:wrap;min-height:20px}
  .reco{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);
    font-size:13px;font-weight:500;transition:.15s;display:flex;align-items:center;gap:6px}
  .reco:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  .reco.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
  .reco.create{border-style:dashed;color:var(--muted)}
  .reco.create:hover{border-color:var(--ink);color:var(--ink);background:#f3f1f8}
  .adder .actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
  #chosenTag{margin-right:auto;font-size:13px;color:var(--muted);align-self:center}

  .toolbar{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;background:var(--card);outline:none}
  @media(min-width:561px){.search input{font-size:14px}}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
  .sortsel{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;
    font-family:inherit;background:var(--card);outline:none}
  @media(min-width:561px){.sortsel{font-size:13.5px}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);
    font-size:13px;font-weight:500;color:var(--muted);transition:.15s;display:flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--brand-2)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip .c{font-size:11px;opacity:.75}
  .chip .mini{opacity:.45;font-weight:700;margin-left:2px;padding:0 2px}
  .chip .mini:hover{opacity:1;color:var(--brand)}
  .chip .mini.danger:hover{color:#e05a5a}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px;padding-bottom:40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 17px;position:relative;transition:.18s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d7cee8}
  .card .tag{position:absolute;top:13px;right:13px;font-size:11px;padding:2px 8px;border-radius:99px;
    background:var(--brand-soft);color:var(--brand);font-weight:500}
  .card .fr{font-size:20px;font-weight:700;letter-spacing:-.2px;padding-right:70px}
  .card .pos{display:inline-block;margin-top:7px;font-size:11px;padding:1px 7px;border-radius:6px;
    background:#f2eefa;color:var(--brand);font-weight:500}
  .card .senses{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .card .sense{font-size:14px}
  .card .sense .idx{color:var(--muted);font-size:11px;margin-right:3px}
  .card .sense .eg{display:block;font-size:12px;color:#6f6a80;margin-top:2px;padding-left:14px}
  .s-b{font-weight:700}
  .s-h{background:var(--hl);border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--hl-line)}
  .s-c{color:#c026d3;font-weight:600}
  .card .note{margin-top:11px;padding:9px 11px;background:#faf8ff;border:1px solid var(--line);
    border-radius:8px;font-size:12.5px;color:#5b5470;white-space:pre-wrap}
  .card .note b{color:var(--brand)}
  .card .meta{margin-top:11px;display:flex;align-items:center;gap:8px;font-size:11px;color:#a8a2ba}
  .card .meta .edit{margin-left:auto;color:var(--muted);padding:2px 4px}
  .card .meta .edit:hover{color:var(--brand)}
  .card .meta .del{color:var(--muted);padding:2px 4px}
  .card .meta .del:hover{color:#e05a5a}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
  .empty div{font-size:34px;margin-bottom:8px}
  footer{color:var(--muted);font-size:12.5px;text-align:center;padding:22px 0 34px;border-top:1px solid var(--line)}

  /* 编辑弹窗 */
  .mask{position:fixed;inset:0;background:rgba(43,37,64,.42);display:none;place-items:center;z-index:50;padding:20px}
  .mask.show{display:grid}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;
    padding:22px;box-shadow:0 20px 60px rgba(43,37,64,.3)}
  .modal h3{font-size:17px;margin-bottom:14px}
  .modal .row{margin-bottom:12px}
  .modal .mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .inlineNew{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  /* 移动端 */
  @media(max-width:560px){
    .wrap{padding:0 13px}
    .hd{height:56px}
    .logo{font-size:16px}
    .logo small{display:none}
    .hero h1{font-size:19px}
    .adder{padding:14px;border-radius:12px}
    .row{gap:8px}
    .fld{min-width:0;flex:1 1 100%}
    select,.fld select{width:100%}
    .toolbar{gap:8px}
    .search{min-width:0;flex:1 1 100%}
    .sortsel{flex:1}
    .grid{grid-template-columns:1fr;gap:11px}
    .card{padding:14px}
    .card .fr{font-size:18px}
    .modal{padding:16px;border-radius:14px;max-height:92vh}
    .btn{padding:10px 15px}
    .card .meta .edit,.card .meta .del{padding:6px 8px;font-size:12px}
  }
  @media(min-width:561px) and (max-width:900px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  }
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <div class="logo"><span class="dot">C</span>Carnet<small>法语生词本</small></div>
    <div class="hd-actions">
      <span class="savedot" id="saveDot" title="数据自动保存在本机浏览器"><i></i>已自动保存</span>
      <button class="btn sm" id="exportBtn">导出</button>
      <button class="btn sm" id="importBtn">导入</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero"><h1>我的生词本</h1><span id="countLabel"></span></div>

  <!-- 添加区 -->
  <section class="adder">
    <div class="row">
      <div class="fld" style="flex:2"><label>法语单词 / 词组</label>
        <input type="text" id="inFr" placeholder="如 rendez-vous" autocomplete="off"></div>
      <div class="fld"><label>词性</label>
        <select id="inPos">
          <option value="">未指定</option>
          <option value="n.m.">名词 · 阳性 (n.m.)</option>
          <option value="n.f.">名词 · 阴性 (n.f.)</option>
          <option value="n.m./f.">名词 · 阴阳同形</option>
          <option value="v.i.">不及物动词 (v.i.)</option>
          <option value="v.t.">及物动词 (v.t.)</option>
          <option value="v.pr.">代词式动词 (v.pr.)</option>
          <option value="adj.">形容词 (adj.)</option>
          <option value="adv.">副词 (adv.)</option>
          <option value="prép.">介词 (prép.)</option>
          <option value="conj.">连词 (conj.)</option>
          <option value="pron.">代词 (pron.)</option>
          <option value="其他">其他</option>
        </select></div>
    </div>

    <div class="section-title">中文释义（可多条；每条可加例句，并可批注）</div>
    <div id="senseList"></div>
    <button class="btn sm" id="addSense">＋ 添加一条释义</button>

    <div class="row full" style="margin-top:14px">
      <div class="fld"><label>备注（收录后想补充的都写这里）</label>
        <textarea id="inNote" rows="2" placeholder="选填，如：易混词、记忆法、来源课文…"></textarea></div>
    </div>

    <div class="row" style="margin-top:6px;align-items:flex-end">
      <div class="fld" style="flex:2"><label>主题</label>
        <div class="recos" id="recos" style="min-height:34px;align-items:center"></div></div>
    </div>
    <div class="hint" id="recoHint" style="display:none;font-size:12px;color:var(--muted);margin:-4px 0 8px">
      点击主题归类；都不合适点「＋ 新建主题」：</div>

    <div class="actions">
      <span id="chosenTag"></span>
      <button class="btn" id="clearBtn">清空</button>
      <button class="btn primary" id="addBtn">加入生词本</button>
    </div>
  </section>

  <!-- 查阅区 -->
  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="搜索法语、中文释义或备注…" autocomplete="off">
    </div>
    <select class="sortsel" id="sortSel">
      <option value="new">最近添加</option>
      <option value="old">最早添加</option>
      <option value="az">法语 A→Z</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>Carnet · 数据自动保存在本机浏览器 · 淡紫主题</footer>

<!-- 编辑弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h3>编辑生词</h3>
    <div class="row"><div class="fld"><label>法语单词</label><input type="text" id="eFr" autocomplete="off"></div>
      <div class="fld"><label>词性</label>
        <select id="ePos">
          <option value="">未指定</option>
          <option value="n.m.">名词 · 阳性 (n.m.)</option>
          <option value="n.f.">名词 · 阴性 (n.f.)</option>
          <option value="n.m./f.">名词 · 阴阳同形</option>
          <option value="v.i.">不及物动词 (v.i.)</option>
          <option value="v.t.">及物动词 (v.t.)</option>
          <option value="v.pr.">代词式动词 (v.pr.)</option>
          <option value="adj.">形容词 (adj.)</option>
          <option value="adv.">副词 (adv.)</option>
          <option value="prép.">介词 (prép.)</option>
          <option value="conj.">连词 (conj.)</option>
          <option value="pron.">代词 (pron.)</option>
          <option value="其他">其他</option>
        </select></div></div>
    <div class="section-title">中文释义与例句（可批注：B 加粗 / H 高亮 / 玫红）</div>
    <div id="eSenseList"></div>
    <button class="btn sm" id="eAddSense">＋ 添加一条释义</button>
    <div class="row full" style="margin-top:14px"><div class="fld"><label>备注</label><textarea id="eNote" rows="2"></textarea></div></div>
    <div class="row"><div class="fld"><label>主题</label><div class="recos" id="eRecos" style="min-height:34px;align-items:center"></div></div></div>
    <div class="mact"><button class="btn" id="eCancel">取消</button><button class="btn primary" id="eSave">保存</button></div>
  </div>
</div>

<script>
const DEFAULT_TOPICS=["日常","医疗","人工智能","时尚","美食","旅行","职场","科技","学习","娱乐"];
const ICONS={"日常":"☕","医疗":"🏥","人工智能":"🤖","时尚":"👗","美食":"🥐","旅行":"✈️","职场":"💼","科技":"💻","学习":"📚","娱乐":"🎬"};
const KEYWORDS={
  "医疗":["médecin","médicament","ordonnance","symptôme","urgence","hôpital","maladie","douleur","fièvre","toux","pharmacie","rendez-vous","santé","docteur"],
  "人工智能":["intelligence","artificielle","algorithme","données","apprentissage","neurones","réseau","modèle","robot","chatbot"],
  "时尚":["vêtement","robe","jupe","chaussure","mode","tendance","élégant","accessoire","collection","sac","bijou","maquillage"],
  "美食":["baguette","croissant","fromage","déjeuner","dîner","café","pain","vin","repas","restaurant","gâteau","chocolat"],
  "旅行":["itinéraire","réservation","billet","valise","hôtel","voyage","aéroport","gare","ville","visiter","passeport","plage"],
  "职场":["réunion","collègue","projet","bureau","travail","emploi","salaire","chef","entreprise","client","tâche","entretien"],
  "科技":["logiciel","écran","ordinateur","développeur","code","téléphone","internet","application","site","serveur"],
  "学习":["cours","étudiant","professeur","école","université","examen","devoir","leçon","livre","lire","écrire","apprendre"],
  "娱乐":["film","musique","jeu","concert","spectacle","sport","photo","télévision","série","danse","festival"]
};

const KEY="carnet_fr_v2";
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.words)return s;}catch(e){}
  return {words:[],topics:[...DEFAULT_TOPICS]};}
let saveTimer=null;
function save(){clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));flashSaved();}
    catch(e){alert('保存失败：本地存储可能已满，请导出备份后清理');}},120);}
function flashSaved(){const d=document.getElementById('saveDot');d.style.opacity='.4';
  setTimeout(()=>{d.style.opacity='';},250);}
function ensureTopic(t){if(t&&!state.topics.includes(t))state.topics.push(t);}
function renameTopic(oldT,newT){state.topics=state.topics.map(t=>t===oldT?newT:t);
  state.words.forEach(w=>{if(w.topic===oldT)w.topic=newT;});}
function dropTopic(t){state.topics=state.topics.filter(x=>x!==t);}
const blankSense=()=>({zh:"",eg:"",b:false,h:false,c:false});

/* ---------- 推荐主题 ---------- */
function recommend(fr){
  const w=(fr||'').toLowerCase();const scored=[];
  Object.keys(KEYWORDS).forEach(t=>{const hit=KEYWORDS[t].filter(k=>w.includes(k)).length;if(hit)scored.push({t,hit});});
  scored.sort((a,b)=>b.hit-a.hit);
  let names=scored.map(s=>s.t);
  state.topics.forEach(t=>{if(w.includes(t.toLowerCase())&&!names.includes(t))names.push(t);});
  const out=[];[...names,...DEFAULT_TOPICS].forEach(n=>{if(!out.includes(n))out.push(n);});
  return out.slice(0,3);
}

/* ---------- 释义条目编辑器 ---------- */
function senseRow(s){
  return `<div class="pair" data-i="__">
    <div class="prow">
      <input type="text" class="s-zh" placeholder="中文释义" value="${esc(s.zh)}">
      <div class="fbtns">
        <button class="fbtn b ${s.b?'on':''}" data-f="b" title="加粗">B</button>
        <button class="fbtn h ${s.h?'on':''}" data-f="h" title="高亮">H</button>
        <button class="fbtn c ${s.c?'on':''}" data-f="c" title="玫红色">A</button>
        <button class="fbtn" data-f="del" title="删除">✕</button>
      </div>
    </div>
    <input type="text" class="s-eg" placeholder="例句（选填）" value="${esc(s.eg)}" style="width:100%">
  </div>`;
}
function bindSenseList(container,getList){
  container.querySelectorAll('.pair').forEach(p=>{
    const i=+p.dataset.i; const list=getList();
    if(!list[i])return;
    p.querySelector('.s-zh').oninput=e=>list[i].zh=e.target.value;
    p.querySelector('.s-eg').oninput=e=>list[i].eg=e.target.value;
    p.querySelectorAll('.fbtn').forEach(fb=>{
      fb.onclick=()=>{
        const f=fb.dataset.f;
        if(f==='del'){list.splice(i,1);}
        else{list[i][f]=!list[i][f];}
        getList._render();
      };
    });
  });
}
function renderSenseList(container,list){
  container.innerHTML=list.map((s,i)=>senseRow(s).replace(/data-i="__"/,`data-i="${i}"`)).join('')||
    `<div style="font-size:12px;color:var(--muted)">暂无释义，点下方添加</div>`;
  if(!list.length)container.dataset.empty="1";else delete container.dataset.empty;
}

/* ---------- 添加区 ---------- */
let draftSenses=[blankSense()], chosenTopic=null;
const senseListEl=document.getElementById('senseList');
function renderAddSenses(){renderSenseList(senseListEl,draftSenses);
  draftSenses._render=()=>{renderAddSenses();};bindSenseList(senseListEl,()=>draftSenses);}
document.getElementById('addSense').onclick=()=>{draftSenses.push(blankSense());renderAddSenses();};
const inFr=document.getElementById('inFr'), inPos=document.getElementById('inPos'), inNote=document.getElementById('inNote');

function startCreate(wrap,onDone){
  if(wrap.querySelector('input'))return;
  wrap.innerHTML=`<input type="text" class="newTopicInput" placeholder="主题名，回车确认" style="padding:6px 10px;border:1px solid var(--brand);border-radius:99px;font-size:13px;width:140px;outline:none">
    <button class="btn sm primary" data-nk="ok" style="margin-left:6px">确定</button>
    <button class="btn sm" data-nk="cancel" style="margin-left:4px">取消</button>`;
  const input=wrap.querySelector('.newTopicInput');input.focus();
  const restore=()=>{wrap.innerHTML=`<button class="reco create" data-nk="open">＋ 新建主题…</button>`;
    wrap.querySelector('[data-nk=open]').onclick=()=>startCreate(wrap,onDone);};
  const confirm=()=>{const n=input.value.trim();
    if(n){ensureTopic(n);save();restore();onDone(n);}
    else{restore();}};
  wrap.querySelector('[data-nk=ok]').onclick=confirm;
  wrap.querySelector('[data-nk=cancel]').onclick=restore;
  input.onkeydown=e=>{if(e.key==='Enter')confirm();if(e.key==='Escape')restore();};
}

function renderRecos(){
  const fr=inFr.value.trim();const box=document.getElementById('recos');const hint=document.getElementById('recoHint');
  const rec=fr?recommend(fr):[];
  const all=[];[...rec,...state.topics].forEach(t=>{if(!all.includes(t))all.push(t);});
  if(all.length===0&&!fr){box.innerHTML='';hint.style.display='none';}
  else{box.innerHTML=all.map(t=>{
    const isRec=rec.includes(t);
    return `<button class="reco ${chosenTopic===t?'sel':''}" data-t="${esc(t)}">${isRec?'✨ ':''}${ICONS[t]||'🏷️'} ${esc(t)}</button>`;
  }).join('')+`<span class="createWrap" id="createWrap"><button class="reco create" data-nk="open">＋ 新建主题…</button></span>`;
    hint.style.display='block';
    box.querySelectorAll('.reco[data-t]').forEach(b=>{
      b.onclick=()=>{chosenTopic=b.dataset.t;
        box.querySelectorAll('.reco[data-t]').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        document.getElementById('chosenTag').textContent='已选主题：'+(ICONS[chosenTopic]||'')+chosenTopic;};
    });
    const cw=document.getElementById('createWrap');
    cw.querySelector('[data-nk=open]').onclick=()=>startCreate(cw,n=>{chosenTopic=n;
      document.getElementById('chosenTag').textContent='已选主题：🏷️ '+n;renderChips();renderRecos();});
  }
}
inFr.oninput=renderRecos;

document.getElementById('addBtn').onclick=()=>{
  const fr=inFr.value.trim();
  if(!fr){alert('请先输入单词');inFr.focus();return;}
  if(!chosenTopic){alert('请选择一个主题，或新建主题');return;}
  ensureTopic(chosenTopic);
  const senses=draftSenses.filter(s=>s.zh.trim()||s.eg.trim()).map(s=>({...s,zh:s.zh.trim(),eg:s.eg.trim()}));
  state.words.unshift({id:"w"+Date.now(),fr,pos:inPos.value,senses,
    note:inNote.value.trim(),topic:chosenTopic,ts:Date.now()});
  save();resetAdd();render();
};
function resetAdd(){inFr.value='';inPos.value='';inNote.value='';chosenTopic=null;
  draftSenses=[blankSense()];document.getElementById('chosenTag').textContent='';
  document.getElementById('recos').innerHTML='';document.getElementById('recoHint').style.display='none';renderAddSenses();}
document.getElementById('clearBtn').onclick=resetAdd;

/* ---------- 主题管理 ---------- */
function renameTopicPrompt(oldT){
  const input=document.createElement('input');
  const n=prompt('把主题「'+oldT+'」改名为：',oldT);
  if(n===null)return;
  const name=n.trim();
  if(!name){alert('主题名不能为空');return;}
  if(name!==oldT&&state.topics.includes(name)){alert('已存在同名主题');return;}
  renameTopic(oldT,name);save();
  if(curTopic===oldT)curTopic=name;
  if(chosenTopic===oldT)chosenTopic=name;
  if(editTopic===oldT)editTopic=name;
  render();renderRecos();
}
function deleteTopic(t){
  const n=state.words.filter(w=>w.topic===t).length;
  if(n>0){
    if(!confirm('主题「'+t+'」下还有 '+n+' 个单词。\n\n点「确定」将连同这些单词一起删除；点「取消」可先去改它们的主题。'))return;
    state.words=state.words.filter(w=>w.topic!==t);
  }else{
    if(!confirm('删除空主题「'+t+'」？'))return;
  }
  dropTopic(t);
  if(curTopic===t)curTopic='all';
  if(chosenTopic===t)chosenTopic=null;
  if(editTopic===t)editTopic=null;
  save();render();renderRecos();
}

/* ---------- 查阅渲染 ---------- */
let curTopic='all',curQuery='',curSort='new';
function senseHTML(s,i){
  let cls='';
  if(s.b)cls+=' s-b'; if(s.h)cls+=' s-h'; if(s.c)cls+=' s-c';
  const eg=s.eg?`<span class="eg">${esc(s.eg)}</span>`:'';
  return `<div class="sense"><span class="idx">${i+1}.</span><span class="${cls}">${esc(s.zh)||'—'}</span>${eg}</div>`;
}
function renderChips(){
  const counts={};state.words.forEach(w=>counts[w.topic]=(counts[w.topic]||0)+1);
  let html=`<button class="chip ${curTopic==='all'?'on':''}" data-t="all">全部 <span class="c">${state.words.length}</span></button>`;
  state.topics.forEach(t=>{html+=`<button class="chip ${curTopic===t?'on':''}" data-t="${esc(t)}">${ICONS[t]||'🏷️'} ${esc(t)} <span class="c">${counts[t]||0}</span><span class="mini" data-act="rename" title="重命名">✎</span><span class="mini danger" data-act="del" title="删除主题">✕</span></button>`;});
  document.getElementById('chips').innerHTML=html;
  document.querySelectorAll('.chip').forEach(c=>{
    c.querySelector('[data-act=rename]').onclick=e=>{e.stopPropagation();renameTopicPrompt(c.dataset.t);};
    c.querySelector('[data-act=del]').onclick=e=>{e.stopPropagation();deleteTopic(c.dataset.t);};
    c.onclick=()=>{curTopic=c.dataset.t;render();};
  });
}
function renderGrid(){
  const q=curQuery.trim().toLowerCase();
  let list=state.words.filter(w=>{
    if(curTopic!=='all'&&w.topic!==curTopic)return false;
    if(q){const hay=(w.fr+' '+(w.senses||[]).map(s=>s.zh+' '+s.eg).join(' ')+' '+(w.note||'')).toLowerCase();
      if(!hay.includes(q))return false;}
    return true;});
  if(curSort==='new')list.sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(curSort==='old')list.sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(curSort==='az')list.sort((a,b)=>a.fr.localeCompare(b.fr,'fr'));
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML=`<div class="empty"><div>📓</div>生词本还是空的，上面添加第一个词吧</div>`;return;}
  grid.innerHTML=list.map(w=>`
    <div class="card" data-id="${w.id}">
      <span class="tag">${ICONS[w.topic]||'🏷️'} ${esc(w.topic)}</span>
      <div class="fr">${esc(w.fr)}</div>
      ${w.pos?`<span class="pos">${esc(w.pos)}</span>`:''}
      <div class="senses">${(w.senses&&w.senses.length)?w.senses.map(senseHTML).join(''):'<div class="sense" style="color:var(--muted)">—</div>'}</div>
      ${w.note?`<div class="note">📝 ${esc(w.note)}</div>`:''}
      <div class="meta">
        <span>${new Date(w.ts||Date.now()).toLocaleDateString('zh-CN')}</span>
        <button class="edit" data-act="edit">编辑</button>
        <button class="del" data-act="del">删除</button>
      </div>
    </div>`).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    const id=card.dataset.id;
    card.querySelector('[data-act=del]').onclick=()=>{if(confirm('删除这个生词？')){state.words=state.words.filter(x=>x.id!==id);save();render();}};
    card.querySelector('[data-act=edit]').onclick=()=>openEdit(id);
  });
}
function render(){
  document.getElementById('countLabel').textContent=`共 ${state.words.length} 词 · ${state.topics.length} 个主题`;
  renderChips();renderGrid();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- 编辑弹窗 ---------- */
let editingId=null,editSenses=[],editTopic=null;
const mask=document.getElementById('mask');
function openEdit(id){
  const w=state.words.find(x=>x.id===id);if(!w)return;editingId=id;
  document.getElementById('eFr').value=w.fr;
  document.getElementById('ePos').value=w.pos||'';
  document.getElementById('eNote').value=w.note||'';
  editSenses=(w.senses&&w.senses.length)?w.senses.map(s=>({...s})):[blankSense()];
  editTopic=w.topic;
  renderEditSenses();renderEditRecos();
  mask.classList.add('show');
}
function renderEditSenses(){const c=document.getElementById('eSenseList');
  renderSenseList(c,editSenses);editSenses._render=()=>renderEditSenses();bindSenseList(c,()=>editSenses);}
document.getElementById('eAddSense').onclick=()=>{editSenses.push(blankSense());renderEditSenses();};
function renderEditRecos(){
  const fr=document.getElementById('eFr').value.trim();const box=document.getElementById('eRecos');
  const rec=recommend(fr);const all=[];[...rec,...state.topics].forEach(t=>{if(!all.includes(t))all.push(t);});
  box.innerHTML=all.slice(0,8).map(t=>`<button class="reco ${t===editTopic?'sel':''}" data-t="${esc(t)}">${ICONS[t]||'🏷️'} ${esc(t)}</button>`).join('')
    +`<span class="createWrap" id="eCreateWrap"><button class="reco create" data-nk="open">＋ 新建主题…</button></span>`;
  box.querySelectorAll('.reco[data-t]').forEach(b=>{
    b.onclick=()=>{editTopic=b.dataset.t;renderEditRecos();};
  });
  const cw=document.getElementById('eCreateWrap');
  cw.querySelector('[data-nk=open]').onclick=()=>startCreate(cw,n=>{editTopic=n;renderEditRecos();renderChips();});
}
document.getElementById('eFr').oninput=renderEditRecos;
document.getElementById('eCancel').onclick=()=>mask.classList.remove('show');
document.getElementById('eSave').onclick=()=>{
  const w=state.words.find(x=>x.id===editingId);if(!w)return;
  const fr=document.getElementById('eFr').value.trim();if(!fr){alert('单词不能为空');return;}
  ensureTopic(editTopic);
  w.fr=fr;w.pos=document.getElementById('ePos').value;
  w.senses=editSenses.filter(s=>s.zh.trim()||s.eg.trim()).map(s=>({...s,zh:s.zh.trim(),eg:s.eg.trim()}));
  w.note=document.getElementById('eNote').value.trim();w.topic=editTopic;
  save();mask.classList.remove('show');render();
};
mask.onclick=e=>{if(e.target===mask)mask.classList.remove('show');};

/* ---------- 导入导出 / 工具条 ---------- */
document.getElementById('search').oninput=e=>{curQuery=e.target.value;renderGrid();};
document.getElementById('sortSel').onchange=e=>{curSort=e.target.value;renderGrid();};
document.getElementById('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carnet_法语生词本.json';a.click();};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.words){state=d;state.topics=state.topics||DEFAULT_TOPICS;save();render();alert('导入成功');}}catch(err){alert('文件格式错误');}};r.readAsText(f);};

/* ---------- 自动保存保障 ---------- */
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}});

renderAddSenses();render();
</script>
</body>
