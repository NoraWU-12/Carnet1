<title>Carnet · 法语生词本</title>
<style>
  :root{
    --bg:#f7f5fc; --card:#ffffff; --ink:#2b2540; --muted:#8b85a3;
    --line:#ebe6f5; --brand:#8257c9; --brand-2:#a478e0; --brand-soft:#f0e9fb;
    --shadow:0 1px 2px rgba(76,50,120,.04),0 8px 24px rgba(76,50,120,.08);
    --radius:14px;
    --hl:#fff2b2; --hl-line:#f4d84a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1020px;margin:0 auto;padding:0 20px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .btn{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:9px;
    font-size:14px;font-weight:500;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--brand-2)}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .btn.primary:hover{background:#6f45b8;border-color:#6f45b8}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
  .savedot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-right:2px}
  .savedot i{width:6px;height:6px;border-radius:50%;background:#4caf7d;display:block}

  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .hd{display:flex;align-items:center;gap:12px;height:62px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px}
  .logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8257c9,#b48ae8);
    display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
  .logo small{font-weight:400;color:var(--muted);font-size:13px;margin-left:2px}
  .hd-actions{margin-left:auto;display:flex;gap:8px;align-items:center}

  .hero{padding:24px 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .hero h1{font-size:22px;letter-spacing:-.3px}
  .hero span{color:var(--muted);font-size:14px}

  /* 添加区 */
  .adder{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin:14px 0 22px;box-shadow:var(--shadow)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .adder input[type=text],.adder textarea,select{
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;
    font-family:inherit;outline:none;background:var(--card);color:var(--ink)}
  @media(min-width:561px){.adder input[type=text],.adder textarea,select{font-size:14px}}
  .adder input[type=text]:focus,.adder textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  textarea{resize:vertical;min-height:38px;line-height:1.5}
  .fld{flex:1;min-width:150px;display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;color:var(--muted);font-weight:500}
  select{min-width:135px}
  .full input,.full textarea{width:100%}
  .section-title{font-size:12px;color:var(--muted);font-weight:600;margin:6px 0 8px;letter-spacing:.3px}

  .pair{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fcfbff}
  .pair .prow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .pair .prow input[type=text]{flex:1;min-width:0}
  .fbtns{display:flex;gap:4px}
  .fbtn{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;font-size:12px;font-weight:700;
    display:grid;place-items:center;background:var(--card);color:var(--muted)}
  .fbtn:hover{border-color:var(--brand-2)}
  .fbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .fbtn.b.on{background:#2b2540;border-color:#2b2540}
  .fbtn.h.on{background:var(--hl-line);color:#4a3c00;border-color:var(--hl-line)}
  .fbtn.c.on{background:#d946ef;color:#fff;border-color:#d946ef}

  .recos{display:flex;gap:8px;flex-wrap:wrap;min-height:20px}
  .reco{padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);
    font-size:13px;font-weight:500;transition:.15s;display:flex;align-items:center;gap:6px}
  .reco:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  .reco.sel{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
  .reco.create{border-style:dashed;color:var(--muted)}
  .reco.create:hover{border-color:var(--ink);color:var(--ink);background:#f3f1f8}
  .adder .actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
  #chosenTag{margin-right:auto;font-size:13px;color:var(--muted);align-self:center}

  .toolbar{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:10px;
    font-size:16px;font-family:inherit;background:var(--card);outline:none}
  @media(min-width:561px){.search input{font-size:14px}}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45}
  .sortsel{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;
    font-family:inherit;background:var(--card);outline:none}
  @media(min-width:561px){.sortsel{font-size:13.5px}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);
    font-size:13px;font-weight:500;color:var(--muted);transition:.15s;display:flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--brand-2)}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chip .c{font-size:11px;opacity:.75}
  .chip .mini{opacity:.45;font-weight:700;margin-left:2px;padding:0 2px}
  .chip .mini:hover{opacity:1;color:var(--brand)}
  .chip .mini.danger:hover{color:#e05a5a}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px;padding-bottom:40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 17px;position:relative;transition:.18s}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#d7cee8}
  .card .tag{position:absolute;top:13px;right:13px;font-size:11px;padding:2px 8px;border-radius:99px;
    background:var(--brand-soft);color:var(--brand);font-weight:500}
  .card .fr{font-size:20px;font-weight:700;letter-spacing:-.2px;padding-right:70px}
  .card .pos{display:inline-block;margin-top:7px;font-size:11px;padding:1px 7px;border-radius:6px;
    background:#f2eefa;color:var(--brand);font-weight:500}
  .card .senses{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .card .sense{font-size:14px}
  .card .sense .idx{color:var(--muted);font-size:11px;margin-right:3px}
  .card .sense .eg{display:block;font-size:12px;color:#6f6a80;margin-top:2px;padding-left:14px}
  .s-b{font-weight:700}
  .s-h{background:var(--hl);border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--hl-line)}
  .s-c{color:#c026d3;font-weight:600}
  .card .note{margin-top:11px;padding:9px 11px;background:#faf8ff;border:1px solid var(--line);
    border-radius:8px;font-size:12.5px;color:#5b5470;white-space:pre-wrap}
  .card .note b{color:var(--brand)}
  .card .meta{margin-top:11px;display:flex;align-items:center;gap:8px;font-size:11px;color:#a8a2ba}
  .card .meta .edit{margin-left:auto;color:var(--muted);padding:2px 4px}
  .card .meta .edit:hover{color:var(--brand)}
  .card .meta .del{color:var(--muted);padding:2px 4px}
  .card .meta .del:hover{color:#e05a5a}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
  .empty div{font-size:34px;margin-bottom:8px}
  footer{color:var(--muted);font-size:12.5px;text-align:center;padding:22px 0 34px;border-top:1px solid var(--line)}

  /* 编辑弹窗 */
  .mask{position:fixed;inset:0;background:rgba(43,37,64,.42);display:none;place-items:center;z-index:50;padding:20px}
  .mask.show{display:grid}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;
    padding:22px;box-shadow:0 20px 60px rgba(43,37,64,.3)}
  .modal h3{font-size:17px;margin-bottom:14px}
  .modal .row{margin-bottom:12px}
  .modal .mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .inlineNew{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  /* 移动端 */
  @media(max-width:560px){
    .wrap{padding:0 13px}
    .hd{height:56px}
    .logo{font-size:16px}
    .logo small{display:none}
    .hero h1{font-size:19px}
    .adder{padding:14px;border-radius:12px}
    .row{gap:8px}
    .fld{min-width:0;flex:1 1 100%}
    select,.fld select{width:100%}
    .toolbar{gap:8px}
    .search{min-width:0;flex:1 1 100%}
    .sortsel{flex:1}
    .grid{grid-template-columns:1fr;gap:11px}
    .card{padding:14px}
    .card .fr{font-size:18px}
    .modal{padding:16px;border-radius:14px;max-height:92vh}
    .btn{padding:10px 15px}
    .card .meta .edit,.card .meta .del{padding:6px 8px;font-size:12px}
  }
  @media(min-width:561px) and (max-width:900px){
    .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
  }

  /* 页签切换 */
  .tabs{display:flex;gap:6px;background:var(--brand-soft);padding:4px;border-radius:99px;margin:0 0 16px}
  .tab{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);
    padding:9px 12px;border-radius:99px;cursor:pointer;transition:.18s}
  .tab.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
  .page{display:none}
  .page.on{display:block}

  /* 录入子页签（生词/表达） */
  .subtabs{display:flex;gap:6px;background:var(--brand-soft);padding:4px;border-radius:99px;margin:0 0 14px}
  .subtab{flex:1;border:none;background:transparent;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);
    padding:8px 12px;border-radius:99px;cursor:pointer;transition:.18s}
  .subtab.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
  /* 表达对照行 */
  .erow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;margin-bottom:8px}
  .erow .fr-input,.erow .zh-input{width:100%}
  .erow .prow{margin-bottom:6px}
  @media(max-width:560px){.erow{grid-template-columns:1fr}}
  /* 类型筛选 */
  .typesel{display:inline-flex;gap:4px;background:var(--brand-soft);padding:3px;border-radius:99px}
  .typesel button{border:none;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
    padding:5px 12px;border-radius:99px;cursor:pointer;transition:.18s}
  .typesel button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
  /* 表达卡片 */
  .exprcard .erow-list{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
  .exprcard .eline{display:flex;gap:8px;padding:4px 0;align-items:baseline;flex-wrap:wrap}
  .exprcard .enum{color:var(--brand);font-weight:700;font-size:12px;min-width:16px}
  .exprcard .efr{font-weight:600;color:var(--ink)}
  .exprcard .earrow{color:var(--muted);font-size:12px}
  .expr-group-title{font-weight:700;color:var(--brand);margin-bottom:4px}

  /* 笔记本视图 */
  .bookbar{display:flex;gap:10px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
  .bookbar .search{flex:1;min-width:180px}
  .shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding-bottom:40px}
  .book{--c1:#a478e0;--c2:#8257c9;position:relative;display:flex;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    min-height:132px;cursor:pointer;font-family:inherit;padding:0;width:100%;transition:.2s;
    box-shadow:0 2px 8px rgba(96,62,160,.06)}
  .book.c0{--c1:#b48ae6;--c2:#8a5fd0}.book.c1{--c1:#9d8be8;--c2:#6f56c9}
  .book.c2{--c1:#c08ad4;--c2:#9559b8}.book.c3{--c1:#8fa8e8;--c2:#5f74c9}
  .book.c4{--c1:#d18ab8;--c2:#a8588c}.book.c5{--c1:#8ab8d8;--c2:#586fa8}
  .book:hover{transform:translateY(-4px);box-shadow:0 10px 22px rgba(96,62,160,.16);border-color:#d9c9f2}
  .book .bspine{width:8px;flex:0 0 8px;background:linear-gradient(180deg,var(--c1),var(--c2));position:relative}
  .book .bspine::after{content:'';position:absolute;left:2px;top:50%;transform:translateY(-50%);
    width:2px;height:60%;background:rgba(255,255,255,.45);border-radius:2px}
  .book .bmain{flex:1;min-width:0;padding:13px 12px 12px 14px;display:flex;flex-direction:column;gap:6px}
  .book .bhead{display:flex;align-items:flex-start;gap:6px}
  .book .bico{font-size:17px;margin-right:4px}
  .book .bname{font-size:15.5px;font-weight:700;color:var(--ink);word-break:break-all;flex:1;line-height:1.35}
  .book .bacts{display:flex;gap:3px;opacity:0;transition:.15s}
  .book:hover .bacts,.book .bacts:focus-within{opacity:1}
  @media(hover:none){.book .bacts{opacity:1}}
  .book .bacts span{width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;
    font-size:12px;color:var(--muted);background:var(--bg)}
  .book .bacts span:hover{background:var(--brand-soft);color:var(--brand)}
  .book .bstat{font-size:12px;color:var(--muted)}
  .book .bstat b{color:var(--brand);font-size:14px}
  .book .bprev{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px;min-height:20px}
  .book .bpill{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--brand-soft);color:#6a4aa8;
    max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .book .bempty{font-size:11.5px;color:#b5aeca}
  .book .bbar{margin-top:auto;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
  .book .bbar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:.3s}
  .bookadd{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;
    border:2px dashed #cfc0e8;color:var(--muted);border-radius:14px;min-height:132px;
    cursor:pointer;font-family:inherit;font-size:14px;transition:.18s}
  .bookadd:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
  .bookhead{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
  .backbtn{border:1px solid var(--line);background:var(--card);color:var(--brand);border-radius:99px;
    padding:7px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .bookhead h2{font-size:18px;margin:0}
  .wordlist{display:flex;flex-direction:column;gap:10px;padding-bottom:40px}
  .wrow{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;
    display:flex;gap:10px;align-items:flex-start}
  .wrow .wmain{flex:1;min-width:0}
  .wrow .wfr{font-size:17px;font-weight:700}
  .wrow .wzh{font-size:13px;color:#5b5470;margin-top:6px}
  .wrow .wzh.senses{display:flex;flex-direction:column;gap:0}
  .wrow .wzh .sense{display:block;padding:5px 0;border-bottom:1px dashed var(--line)}
  .wrow .wzh .sense:last-child{border-bottom:none;padding-bottom:0}
  .wrow .wzh .eline{display:block;font-size:12px;color:var(--brand);background:var(--brand-soft);
    border-radius:6px;padding:3px 9px;margin-top:4px;max-width:100%;box-sizing:border-box;word-break:break-word}
  .wrow .wzh .s-h{background:var(--hl);border-radius:3px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--hl-line)}
  .wrow .wzh .s-b{font-weight:700}
  .wrow .wzh .s-c{color:#c026d3;font-weight:600}
  .wrow .wpos{font-size:11px;padding:1px 7px;border-radius:6px;background:#f2eefa;color:var(--brand);
    margin-left:6px;font-weight:500;vertical-align:middle}
  .wrow .wnote{font-size:12px;color:var(--muted);margin-top:5px;white-space:pre-wrap}
  .wrow .worder{display:flex;flex-direction:column;gap:4px}
  .wrow .worder button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:7px;
    width:28px;height:26px;line-height:1;cursor:pointer;font-size:12px;padding:0}
  .wrow .worder button:hover{border-color:var(--brand);color:var(--brand)}
  .wrow .wops{display:flex;flex-direction:column;gap:4px}
  .wrow .wops button{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;padding:4px}
  .wrow .wops button:hover{color:var(--brand)}
  .wrow .wops button.danger:hover{color:#e05a5a}
  /* 数据统计 */
  .today-box{font-size:13px;color:#5b5470;line-height:1.7}
  .today-box .t-empty{color:var(--muted);padding:8px 0}
  .today-box .t-block{margin:8px 0;padding:8px 10px;border-left:3px solid var(--brand);background:#faf8ff;border-radius:0 8px 8px 0}
  .today-box .t-block b{color:var(--brand)}
  .today-box .t-sec{margin-top:14px;font-weight:700;color:var(--brand);font-size:12px;letter-spacing:.5px}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat-grid .sc{background:#faf8ff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .stat-grid .sc .v{font-size:22px;font-weight:800;color:var(--brand)}
  .stat-grid .sc .l{font-size:11px;color:var(--muted);margin-top:3px}
  .stat-barlist{display:flex;flex-direction:column;gap:8px}
  .stat-barlist .sb{display:flex;align-items:center;gap:8px;font-size:12px}
  .stat-barlist .sb .nm{width:88px;flex:none;color:#5b5470;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat-barlist .sb .track{flex:1;height:14px;background:#f0ecf8;border-radius:7px;overflow:hidden}
  .stat-barlist .sb .fill{height:100%;background:linear-gradient(90deg,var(--brand),#b79bf0);border-radius:7px}
  .stat-barlist .sb .ct{width:34px;flex:none;text-align:right;color:var(--muted)}
  .stat-barlist .s-empty{color:var(--muted);font-size:12px}
  .stat-heat{display:flex;gap:5px;align-items:flex-end;height:90px}
  .stat-heat .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
  .stat-heat .col .bar{width:100%;background:linear-gradient(180deg,#b79bf0,var(--brand));border-radius:4px 4px 0 0;min-height:2px}
  .stat-heat .col .bar.zero{background:#eae4f5}
  .stat-heat .col .lb{font-size:9px;color:var(--muted)}
  @media(max-width:560px){.stat-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){
    .shelves{grid-template-columns:1fr;gap:10px}
    .book{min-height:0}
    .book .bname{font-size:14px}
    .book .bpill{max-width:110px}
  }

  /* 自定义对话框（替代被独立模式屏蔽的 alert/confirm/prompt） */
  .dlg{position:fixed;inset:0;background:rgba(43,37,64,.42);display:none;place-items:center;z-index:80;padding:20px}
  .dlg.show{display:grid}
  .dlgbox{background:var(--card);border-radius:14px;width:100%;max-width:360px;padding:20px;box-shadow:0 20px 60px rgba(43,37,64,.3)}
  .dlgbox h4{font-size:15px;margin:0 0 10px}
  .dlgbox p{font-size:13.5px;color:#5b5470;line-height:1.6;margin:0 0 16px;white-space:pre-line}
  .dlgbox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;
    font-family:inherit;outline:none;margin-bottom:14px}
  @media(min-width:561px){.dlgbox input{font-size:14px}}
  .dlgbox input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .dlgact{display:flex;gap:8px;justify-content:flex-end}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);opacity:0;pointer-events:none;
    background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;z-index:99;transition:.22s}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<body>
<header>
  <div class="wrap hd">
    <div class="logo"><span class="dot">C</span>Carnet<small>法语生词本</small></div>
    <div class="hd-actions">
      <span class="savedot" id="saveDot" title="数据自动保存在本机浏览器"><i></i>已自动保存</span>
      <button class="btn sm" id="exportBtn">导出</button>
      <button class="btn sm" id="importBtn">导入</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tabs">
    <button class="tab on" data-page="main">✏️ 录入 / 查阅</button>
    <button class="tab" data-page="book">📓 我的单词本</button>
    <button class="tab" data-page="notes">🗒️ 常识积累</button>
    <button class="tab" data-page="stats">📊 数据统计</button>
  </div>

  <!-- ============ 页面一：录入 / 查阅 ============ -->
  <div class="page on" id="pageMain">
  <div class="hero"><h1>我的生词本</h1><span id="countLabel"></span></div>

  <!-- 添加区 -->
  <section class="adder">
    <div class="subtabs">
      <button class="subtab on" data-mode="word">📝 生词</button>
      <button class="subtab" data-mode="expr">💬 表达</button>
    </div>
    <div class="row" id="frRow">
      <div class="fld" style="flex:2"><label id="frLabel">法语单词 / 词组</label>
        <input type="text" id="inFr" placeholder="如 rendez-vous" autocomplete="off"></div>
      <div class="fld" id="posField"><label>词性</label>
        <select id="inPos">
          <option value="">未指定</option>
          <option value="n.m.">名词 · 阳性 (n.m.)</option>
          <option value="n.f.">名词 · 阴性 (n.f.)</option>
          <option value="n.m./f.">名词 · 阴阳同形</option>
          <option value="v.i.">不及物动词 (v.i.)</option>
          <option value="v.t.">及物动词 (v.t.)</option>
          <option value="v.pr.">代词式动词 (v.pr.)</option>
          <option value="adj.">形容词 (adj.)</option>
          <option value="adv.">副词 (adv.)</option>
          <option value="prép.">介词 (prép.)</option>
          <option value="conj.">连词 (conj.)</option>
          <option value="pron.">代词 (pron.)</option>
          <option value="其他">其他</option>
        </select></div>
    </div>

    <div class="section-title" id="senseTitle">中文释义（可多条；每条可加例句，并可批注）</div>

<script>
const DEFAULT_TOPICS=["日常","医疗","人工智能","时尚","美食","旅行","职场","科技","学习","娱乐"];
const POS_ORDER=['n.m.','n.f.','n.m./f.','v.i.','v.t.','v.pr.','adj.','adv.','prép.','conj.','pron.','其他','__expr'];
const ICONS={"日常":"☕","医疗":"🏥","人工智能":"🤖","时尚":"👗","美食":"🥐","旅行":"✈️","职场":"💼","科技":"💻","学习":"📚","娱乐":"🎬"};
const Pick=(map,key)=>map[key]||'';   // 自定义主题不显示图标
const KEYWORDS={
  "医疗":["médecin","médicament","ordonnance","symptôme","urgence","hôpital","maladie","douleur","fièvre","toux","pharmacie","rendez-vous","santé","docteur"],
  "人工智能":["intelligence","artificielle","algorithme","données","apprentissage","neurones","réseau","modèle","robot","chatbot"],
  "时尚":["vêtement","robe","jupe","chaussure","mode","tendance","élégant","accessoire","collection","sac","bijou","maquillage"],
  "美食":["baguette","croissant","fromage","déjeuner","dîner","café","pain","vin","repas","restaurant","gâteau","chocolat"],
  "旅行":["itinéraire","réservation","billet","valise","hôtel","voyage","aéroport","gare","ville","visiter","passeport","plage"],
  "职场":["réunion","collègue","projet","bureau","travail","emploi","salaire","chef","entreprise","client","tâche","entretien"],
  "科技":["logiciel","écran","ordinateur","développeur","code","téléphone","internet","application","site","serveur"],
  "学习":["cours","étudiant","professeur","école","université","examen","devoir","leçon","livre","lire","écrire","apprendre"],
  "娱乐":["film","musique","jeu","concert","spectacle","sport","photo","télévision","série","danse","festival"]
};

const KEY="carnet_fr_v2";
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.words){migrate(s);return s;}}catch(e){}
  return {words:[],topics:[...DEFAULT_TOPICS]};}
function migrate(s){s.topics=s.topics||[...DEFAULT_TOPICS];s.order=s.order||{};s.notes=s.notes||[];
  s.words.forEach(w=>{if(!w.type)w.type='word';
    if(w.type==='expr'&&w.senses)w.senses.forEach(sn=>{if(sn.fr===undefined)sn.fr='';});});}
let saveTimer=null;
function save(){clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(state));flashSaved();}
    catch(e){toast('保存失败：本地存储可能已满，请导出备份后清理');}},120);}
function flashSaved(){const d=document.getElementById('saveDot');d.style.opacity='.4';
  setTimeout(()=>{d.style.opacity='';},250);}
function ensureTopic(t){if(t&&!state.topics.includes(t))state.topics.push(t);}
function renameTopic(oldT,newT){state.topics=state.topics.map(t=>t===oldT?newT:t);
  state.words.forEach(w=>{if(w.topic===oldT)w.topic=newT;});}
function dropTopic(t){state.topics=state.topics.filter(x=>x!==t);}
const blankSense=()=>({zh:"",eg:"",b:false,h:false,c:false});
state.notes=state.notes||[];
const LEVELS=['B1','B2','C1','C2'];
function newNote(){return {id:'n'+Date.now()+Math.random().toString(36).slice(2,6),ts:Date.now(),
  title:'',level:'B2',src:'',listen:false,branches:[{id:'b0',name:'摘录',content:''}]};}
function noteStat(n){let c=0,k=0;(n.branches||[]).forEach(b=>{k+=(b.content||'').length;if((b.content||'').trim())c++;});return {c,k};}

/* ---------- 推荐主题 ---------- */
function recommend(fr){
  const w=(fr||'').toLowerCase();const scored=[];
  Object.keys(KEYWORDS).forEach(t=>{const hit=KEYWORDS[t].filter(k=>w.includes(k)).length;if(hit)scored.push({t,hit});});
  scored.sort((a,b)=>b.hit-a.hit);
  let names=scored.map(s=>s.t);
  state.topics.forEach(t=>{if(w.includes(t.toLowerCase())&&!names.includes(t))names.push(t);});
  const out=[];[...names,...DEFAULT_TOPICS].forEach(n=>{if(!out.includes(n))out.push(n);});
  return out.slice(0,3);
}

/* ---------- 释义条目编辑器 ---------- */
function senseRow(s){
  return `<div class="pair" data-i="__">
    <div class="prow">
      <input type="text" class="s-zh" placeholder="中文释义" value="${esc(s.zh)}">
      <div class="fbtns">
        <button class="fbtn b ${s.b?'on':''}" data-f="b" title="加粗">B</button>
        <button class="fbtn h ${s.h?'on':''}" data-f="h" title="高亮">H</button>
        <button class="fbtn c ${s.c?'on':''}" data-f="c" title="玫红色">A</button>
        <button class="fbtn" data-f="del" title="删除">✕</button>
      </div>
    </div>
    <input type="text" class="s-eg" placeholder="例句（选填）" value="${esc(s.eg)}" style="width:100%">
  </div>`;
}
function bindSenseList(container,getList){
  container.querySelectorAll('.pair').forEach(p=>{
    const i=+p.dataset.i; const list=getList();
    if(!list[i])return;
    p.querySelector('.s-zh').oninput=e=>list[i].zh=e.target.value;
    p.querySelector('.s-eg').oninput=e=>list[i].eg=e.target.value;
    p.querySelectorAll('.fbtn').forEach(fb=>{
      fb.onclick=()=>{
        const f=fb.dataset.f;
        if(f==='del'){list.splice(i,1);}
        else{list[i][f]=!list[i][f];}
        getList._render();
      };
    });
  });
}
function renderSenseList(container,list){
  container.innerHTML=list.map((s,i)=>senseRow(s).replace(/data-i="__"/,`data-i="${i}"`)).join('')||
    `<div style="font-size:12px;color:var(--muted)">暂无释义，点下方添加</div>`;
  if(!list.length)container.dataset.empty="1";else delete container.dataset.empty;
}

/* ---------- 添加区 ---------- */
let draftSenses=[blankSense()], chosenTopic=null, addMode='word';
const senseListEl=document.getElementById('senseList');
const blankExpr=()=>({fr:"",zh:"",eg:"",b:false,h:false,c:false});

/* 表达对照行：法语 + 中文 + 例句，各自独立 */
function exprRow(s){
  return `<div class="pair erow-wrap" data-i="__">
    <div class="erow">
      <input type="text" class="e-fr fr-input" placeholder="法语表达（如 secteur primaire）" value="${esc(s.fr)}">
      <input type="text" class="s-zh zh-input" placeholder="对应中文（如 第一产业）" value="${esc(s.zh)}">
    </div>
    <div class="prow">
      <input type="text" class="s-eg" placeholder="例句（选填）" value="${esc(s.eg)}" style="width:100%;flex:1">
      <div class="fbtns">
        <button class="fbtn b ${s.b?'on':''}" data-f="b" title="加粗">B</button>
        <button class="fbtn h ${s.h?'on':''}" data-f="h" title="高亮">H</button>
        <button class="fbtn c ${s.c?'on':''}" data-f="c" title="玫红色">A</button>
        <button class="fbtn" data-f="del" title="删除">✕</button>
      </div>
    </div>
  </div>`;
}
function renderExprList(container,list){
  container.innerHTML=list.map((s,i)=>exprRow(s).replace(/data-i="__"/,`data-i="${i}"`)).join('')||
    `<div style="font-size:12px;color:var(--muted)">暂无表达，点下方添加一行</div>`;
  if(!list.length)container.dataset.empty="1";else delete container.dataset.empty;
}
function bindExprList(container,getList){
  container.querySelectorAll('.pair').forEach(p=>{
    const i=+p.dataset.i; const list=getList();
    if(!list[i])return;
    const fe=p.querySelector('.e-fr'); if(fe)fe.oninput=e=>list[i].fr=e.target.value;

async function renameTopicPrompt(oldT){
  const name=(await uiPrompt('重命名主题',oldT,'把主题「'+oldT+'」改名为：'))?.trim();
  if(name===null||name===undefined)return;      // 取消
  if(!name){toast('主题名不能为空');return;}
  if(name!==oldT&&state.topics.includes(name)){toast('已存在同名主题');return;}
  if(name!==oldT&&state.order&&state.order[oldT]){
    state.order[name]=state.order[oldT];delete state.order[oldT];
  }
  renameTopic(oldT,name);save();
  if(curTopic===oldT)curTopic=name;
  if(chosenTopic===oldT)chosenTopic=name;
  if(editTopic===oldT)editTopic=name;
  if(bookTopic===oldT)bookTopic=name;
  render();renderRecos();renderShelf();
}
async function deleteTopic(t){
  const n=state.words.filter(w=>w.topic===t).length;
  let ok;
  if(n>0){
    ok=await uiConfirm('删除主题','主题「'+t+'」下还有 '+n+' 个单词。\n\n点「确定」将连同这些单词一起删除；点「取消」可先去改它们的主题。','连同删除');
  }else{
    ok=await uiConfirm('删除主题','删除空主题「'+t+'」？','删除');
  }
  if(!ok)return;
  if(n>0)state.words=state.words.filter(w=>w.topic!==t);
  dropTopic(t);
  if(state.order)delete state.order[t];
  if(curTopic===t)curTopic='all';
  if(chosenTopic===t)chosenTopic=null;
  if(editTopic===t)editTopic=null;
  if(bookTopic===t){bookTopic=null;showShelf();}
  save();render();renderRecos();renderShelf();
}

function renderGrid(){

      if(!hay.includes(q))return false;}
    return true;});
  if(curSort==='new')list.sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(curSort==='old')list.sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(curSort==='az')list.sort((a,b)=>a.fr.localeCompare(b.fr,'fr'));
  if(curSort==='pos')list.sort((a,b)=>{
    const pa=(a.type||'word')==='expr'?'__expr':(a.pos||'zzz'),pb=(b.type||'word')==='expr'?'__expr':(b.pos||'zzz');

    card.querySelector('[data-act=edit]').onclick=()=>openEdit(id);

/* ---------- 自由排序：state.order[topic] = [wordId,...] ---------- */
state.order=state.order||{};
function orderFor(t){return state.order[t]||(state.order[t]=[]);}
function syncOrder(t){
  const arr=(state.order[t]||[]).filter(id=>state.words.some(w=>w.id===id&&w.topic===t));
  const seen=new Set(arr);
  state.words.filter(w=>w.topic===t).sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(w=>{if(!seen.has(w.id))arr.push(w.id);});
  state.order[t]=arr;return arr;
}
function sortedBy(w,key){
  if(key==='new')return[...w].sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(key==='old')return[...w].sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(key==='az')return[...w].sort((a,b)=>a.fr.localeCompare(b.fr,'fr'));
  if(key==='pos')return[...w].sort((a,b)=>{
    const pa=(a.type||'word')==='expr'?'__expr':(a.pos||'zzz'),pb=(b.type||'word')==='expr'?'__expr':(b.pos||'zzz');
    const paIdx=POS_ORDER.indexOf(pa),pbIdx=POS_ORDER.indexOf(pb);
    const c=(paIdx<0?99:paIdx)-(pbIdx<0?99:pbIdx);
    return c!==0?c:a.fr.localeCompare(b.fr,'fr');});
  return w;
}
function moveWord(id,dir){
  const w=state.words.find(x=>x.id===id);if(!w)return;
  const arr=syncOrder(w.topic);let i=arr.indexOf(id);
  if(dir==='top'){arr.splice(i,1);arr.unshift(id);}
  else if(dir==='bottom'){arr.splice(i,1);arr.push(id);}
  else{const j=i+dir;if(j<0||j>=arr.length)return;arr.splice(i,1);arr.splice(j,0,id);}
  save();renderWordsView();
}

/* ---------- 数据统计 ---------- */
function isToday(ts){const d=new Date(ts||0),n=new Date();
  return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();}
function posLabel(p){
  const map={'n.m.':'名词（阳性）','n.f.':'名词（阴性）','n.':'名词','adj.':'形容词','v.i.':'不及物动词','v.t.':'及物动词','v.pr.':'代词式动词','adv.':'副词','prep.':'介词','conj.':'连词','pron.':'代词'};
  return map[p]||(p?p:'未填词性');
}
function buildTodayText(fmt){
  const words=state.words.filter(w=>isToday(w.ts)).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const notes=(state.notes||[]).filter(n=>isToday(n.ts)).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const L=[];const d=new Date();const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  if(fmt==='md'){L.push(`# 今日录入总结 · ${ds}`,'');}
  else{L.push(`今日录入总结  ${ds}`,'='.repeat(28),'');}
  L.push(`生词/表达：${words.length} 条    常识记录：${notes.length} 条`,'');
  if(words.length){
    L.push(fmt==='md'?'## 生词 / 表达':'【生词 / 表达】','');
    words.forEach((w,i)=>{
      const head=(w.type==='expr'?'💬 ':'')+`${i+1}. ${w.fr||''}`+(w.pos?` （${w.pos}）`:'')+`  〔${w.topic||'未分类'}〕`;
      L.push(fmt==='md'?`### ${head}`:head);
      (w.senses||[]).forEach((s,j)=>{
        if(w.type==='expr')L.push(`  - ${s.fr||''} → ${s.zh||''}`+(s.b?'（重点）':''));
        else L.push(`  ${j+1}. ${s.zh||''}`+(s.b?'（重点）':''));
        if(s.eg)L.push(`     例：${s.eg}`);
      });
      if(w.note)L.push(`  📝 备注：${w.note}`);
      L.push('');
    });
  }
  if(notes.length){
    L.push(fmt==='md'?'## 常识积累':'【常识积累】','');
    notes.forEach((n,i)=>{
      L.push(fmt==='md'?`### ${i+1}. ${n.title||'（无标题）'}  〔${n.level||''}${n.listen?' · 精听':''}〕`:`${i+1}. ${n.title||'（无标题）'}  〔${n.level||''}${n.listen?' · 精听':''}〕`);
      if(n.src)L.push(`  来源：${n.src}`);
      (n.branches||[]).forEach(b=>{if((b.content||'').trim()){L.push(`  ▸ ${b.name||'分支'}：`);L.push(`    ${(b.content||'').trim()}`);}});
      L.push('');
    });
  }
  if(!words.length&&!notes.length)L.push(fmt==='md'?'> 今天还没有录入任何内容。':'(今天还没有录入任何内容。)');
  return L.join('\n');
}
function renderStats(){
  const words=state.words,notes=state.notes||[];
  const todayW=words.filter(w=>isToday(w.ts)).length,todayN=notes.filter(n=>isToday(n.ts)).length;
  document.getElementById('statsRangeLabel').textContent=`共 ${words.length} 条词条 · ${notes.length} 条常识`;
  // 今日总结
  const tb=document.getElementById('todaySummary');
  const tw=words.filter(w=>isToday(w.ts)).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const tn=notes.filter(n=>isToday(n.ts)).sort((a,b)=>(a.ts||0)-(b.ts||0));
  let h='';
  if(!tw.length&&!tn.length){h=`<div class="t-empty">今天还没有录入内容，去「录入 / 查阅」或「常识积累」记一条吧 🌱</div>`;}
  else{
    h=`<div>今日新增 <b>${tw.length}</b> 条词条、<b>${tn.length}</b> 条常识记录</div>`;
    if(tw.length){h+=`<div class="t-sec">生词 / 表达</div>`+tw.map(w=>`<div class="t-block"><b>${(w.type==='expr'?'💬 ':'')}${esc(w.fr||'')}</b>${w.pos?` <span style="color:var(--muted)">${esc(w.pos)}</span>`:''} <span style="color:var(--muted)">〔${esc(w.topic||'未分类')}〕</span>${(w.senses||[]).length?`<br>${w.senses.map(s=>w.type==='expr'?`${esc(s.fr||'')} → ${esc(s.zh||'')}`:esc(s.zh||'')).join(' / ')}`:''}</div>`).join('');}
    if(tn.length){h+=`<div class="t-sec">常识积累</div>`+tn.map(n=>`<div class="t-block"><b>${esc(n.title||'（无标题）')}</b> <span style="color:var(--muted)">〔${esc(n.level||'')}${n.listen?' · 精听':''}〕</span>${(n.branches||[]).filter(b=>(b.content||'').trim()).length?`<br>${esc(n.branches.filter(b=>(b.content||'').trim()).map(b=>b.name).join(' / '))}`:''}</div>`).join('');}
  }
  tb.innerHTML=h;
  // 总览
  const wordCnt=words.filter(w=>w.type!=='expr').length,exprCnt=words.length-wordCnt;
  const senseCnt=words.reduce((a,w)=>a+(w.senses||[]).filter(s=>(s.zh&&s.zh.trim())||(s.fr&&s.fr.trim())).length,0);
  const branchCnt=notes.reduce((a,n)=>a+(n.branches||[]).filter(b=>(b.content||'').trim()).length,0);
  document.getElementById('statsOverview').innerHTML=[
    ['词条总数',words.length],['生词',wordCnt],['表达',exprCnt],['主题数',state.topics.length],
    ['释义条数',senseCnt],['常识记录',notes.length],['常识分支',branchCnt],['今日新增',todayW+todayN]
  ].map(([l,v])=>`<div class="sc"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  // 主题分布
  const tc={};words.forEach(w=>{tc[w.topic]=(tc[w.topic]||0)+1;});
  const tArr=Object.entries(tc).sort((a,b)=>b[1]-a[1]);const tMax=tArr.length?tArr[0][1]:1;
  document.getElementById('statsTopics').innerHTML=tArr.length?tArr.map(([k,v])=>
    `<div class="sb"><span class="nm">${esc(k)}</span><span class="track"><span class="fill" style="width:${Math.round(v/tMax*100)}%"></span></span><span class="ct">${v}</span></div>`).join('')
    :'<div class="s-empty">还没有任何词条</div>';
  // 词性分布
  const pc={};words.filter(w=>w.type!=='expr').forEach(w=>{const p=posLabel(w.pos);pc[p]=(pc[p]||0)+1;});
  const pArr=Object.entries(pc).sort((a,b)=>b[1]-a[1]);const pMax=pArr.length?pArr[0][1]:1;
  document.getElementById('statsPos').innerHTML=pArr.length?pArr.map(([k,v])=>
    `<div class="sb"><span class="nm">${esc(k)}</span><span class="track"><span class="fill" style="width:${Math.round(v/pMax*100)}%"></span></span><span class="ct">${v}</span></div>`).join('')
    :'<div class="s-empty">还没有生词</div>';
  // 14天热力
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);days.push(d.getTime());}
  const dayCnt=days.map(t=>words.filter(w=>{const d=new Date(w.ts||0);d.setHours(0,0,0,0);return d.getTime()===t;}).length
    +notes.filter(n=>{const d=new Date(n.ts||0);d.setHours(0,0,0,0);return d.getTime()===t;}).length);
  const hMax=Math.max(1,...dayCnt);
  document.getElementById('statsHeat').innerHTML=days.map((t,i)=>{
    const d=new Date(t);const lb=(d.getMonth()+1)+'/'+d.getDate();
    return `<div class="col" title="${lb}：${dayCnt[i]} 条"><div class="bar ${dayCnt[i]?'':'zero'}" style="height:${Math.max(2,Math.round(dayCnt[i]/hMax*100))}%"></div><span class="lb">${lb}</span></div>`;
  }).join('');
}
function downloadText(filename,content,type){
  const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

  if(!state.topics.includes(name)){toast('没有这个主题，请检查名称');return;}
  const payload={topics:[name],words:state.words.filter(w=>w.topic===name),
    notes:(state.notes||[]).filter(n=>(n.topic||'')===name||(n.topic||'')==='') };
  // 常识暂无主题，仅导出该主题词；若用户想连同全部常识可后续扩展
  payload.notes=(state.notes||[]).filter(n=>(n.topic||'')===name);
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`carnet_主题_${name}.json`;a.click();
  toast(`已导出主题「${name}」`);
};
document.getElementById('exportCsv').onclick=()=>{
  const rows=[['类型','法语','词性','中文释义','例句','主题','备注']];
  state.words.forEach(w=>{(w.senses&&w.senses.length?w.senses:[{zh:'',eg:''}]).forEach(s=>{
    rows.push([w.type==='expr'?'表达':'生词',w.fr||'',w.pos||'',
      w.type==='expr'?`${s.fr||''} → ${s.zh||''}`:s.zh||'',s.eg||'',w.topic||'',w.note||'']);});});
  const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  downloadText('carnet_生词本.csv',csv,'text/csv;charset=utf-8');
  toast('已导出 CSV 表格');
};

/* ---------- 导入导出 / 工具条 ---------- */
document.getElementById('search').oninput=e=>{curQuery=e.target.value;renderGrid();};
document.getElementById('sortSel').onchange=e=>{curSort=e.target.value;renderGrid();};
document.querySelectorAll('#typeSel button').forEach(b=>{
  b.onclick=()=>{curType=b.dataset.type;
    document.querySelectorAll('#typeSel button').forEach(x=>x.classList.toggle('on',x===b));
    renderGrid();};
});
document.getElementById('exportBtn').onclick=async()=>{
  const all=(await uiConfirm('导出','点「确定」导出整个生词本（含全部主题与常识）。\n也可到「📊 数据统计」页按单个主题导出、或导出 CSV 表格。','导出整个生词本'));
  if(!all)return;
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='carnet_法语生词本.json';a.click();
  toast('已导出整个生词本');};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.words){state=d;state.topics=state.topics||DEFAULT_TOPICS;state.order=state.order||{};state.notes=state.notes||[];state.topics.forEach(syncOrder);save();render();uiAlert('导入成功','单词与常识记录已导入');}}catch(err){uiAlert('导入失败','文件格式错误');}};r.readAsText(f);};

/* ---------- 自动保存保障 ---------- */
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}});

renderAddSenses();state.topics.forEach(syncOrder);render();
</script>
</body>
</html>
